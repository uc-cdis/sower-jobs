name: Unit Tests

on: push

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.job }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job:
          - metrics-report
    defaults:
      run:
        working-directory: ${{ matrix.job }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --no-interaction
      - name: Run tests
        run: poetry run pytest -vv
