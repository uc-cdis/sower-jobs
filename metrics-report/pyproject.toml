[tool.poetry]
name = "metrics-report"
version = "1.0.0"
description = "Sower job that writes the monthly Enhanced Metrics report files"
authors = ["Center for Translational Data Science at the University of Chicago <support@gen3.org>"]
packages = [{include = "metrics_report"}]

[tool.poetry.dependencies]
python = ">=3.13, <4"
boto3 = "*"
cdislogging = "*"
requests = "*"
urllib3 = ">=2.6.2"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
